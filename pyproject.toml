[project]
name = "valutatore"
version = "0.1.0"
description = "valutatore using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,file-processing]>=1.15.30,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills", "valutatore"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "37ab0842-1fc9-4334-bd38-9d30e8dba343"
